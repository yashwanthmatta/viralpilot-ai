[project]
name = "viralpilot-ai"
version = "0.1.0"
description = "Autonomous, rights-checked short-form video pipeline"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "redis>=5.0",
  "celery>=5.4",
  "httpx>=0.27",
  "defusedxml>=0.7",
  "cryptography>=43",
  "argon2-cffi>=23.1",
  "itsdangerous>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "pip-audit>=2.7", "bandit>=1.7"]

[tool.setuptools.packages.find]
where = ["packages/shared", "packages/agents", "packages/video", "packages/publishing", "packages/analytics", "apps/api", "apps/worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S"]
ignore = ["S101", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
