name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: vp, POSTGRES_PASSWORD: vp, POSTGRES_DB: vp }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U vp" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Migrations apply cleanly
        env: { DATABASE_URL: "postgresql://vp:vp@localhost:5432/vp" }
        run: alembic upgrade head && alembic check
      - name: Unit tests (SQLite)
        run: pytest -q tests/unit
      - name: Unit + integration tests (PostgreSQL, Redis, real Celery worker)
        env:
          TEST_DATABASE_URL: "postgresql://vp:vp@localhost:5432/vp"
          INTEGRATION_DATABASE_URL: "postgresql://vp:vp@localhost:5432/vp"
          INTEGRATION_REDIS_URL: "redis://localhost:6379/0"
        run: pytest -q --cov=vp_shared --cov=vp_agents --cov=vp_api --cov=vp_publishing --cov=vp_video --cov=vp_analytics tests

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
