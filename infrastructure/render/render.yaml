# Render Blueprint for the always-on backend. NOT applied automatically:
# you create it in the Render dashboard (Blueprints > New Blueprint Instance)
# after reviewing the cost. Background workers have no free tier.
# The dashboard (apps/web) deploys separately to Vercel.
services:
  - type: web
    name: viralpilot-api
    runtime: docker
    dockerfilePath: ./infrastructure/docker/backend.Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /healthz
    preDeployCommand: alembic upgrade head
    autoDeploy: false
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase: { name: viralpilot-db, property: connectionString }
      - key: REDIS_URL
        fromService: { type: keyvalue, name: viralpilot-queue, property: connectionString }
      - { key: ADMIN_PASSWORD_HASH, sync: false }
      - { key: SECRET_KEY, sync: false }
      - { key: CREDENTIALS_KEY, sync: false }
      - { key: WEB_ORIGIN, sync: false }
      - { key: DAILY_LIMIT_USD, value: "5" }
      - { key: MONTHLY_LIMIT_USD, value: "60" }
      - { key: MAX_VIDEOS_PER_DAY, value: "3" }

  - type: worker
    name: viralpilot-worker
    runtime: docker
    dockerfilePath: ./infrastructure/docker/backend.Dockerfile
    dockerContext: .
    dockerCommand: celery -A vp_worker.celery_app worker -B --loglevel=INFO --concurrency=1
    plan: starter
    autoDeploy: false
    disk: { name: media, mountPath: /data, sizeGB: 10 }
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase: { name: viralpilot-db, property: connectionString }
      - key: REDIS_URL
        fromService: { type: keyvalue, name: viralpilot-queue, property: connectionString }
      - { key: CREDENTIALS_KEY, sync: false }
      - { key: MEDIA_DIR, value: /data/media }
      - { key: DAILY_LIMIT_USD, value: "5" }
      - { key: MONTHLY_LIMIT_USD, value: "60" }
      - { key: MAX_VIDEOS_PER_DAY, value: "3" }

  - type: keyvalue
    name: viralpilot-queue
    plan: starter
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  - name: viralpilot-db
    plan: basic-256mb
    ipAllowList: []
