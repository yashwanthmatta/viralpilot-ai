# Local development stack: docker compose up --build
# Copy infrastructure/env/development.env.example to .env first.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: viralpilot
      POSTGRES_PASSWORD: viralpilot
      POSTGRES_DB: viralpilot
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U viralpilot"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  migrate:
    build: { context: ., dockerfile: infrastructure/docker/backend.Dockerfile }
    env_file: .env
    command: ["alembic", "upgrade", "head"]
    depends_on: { postgres: { condition: service_healthy } }

  api:
    build: { context: ., dockerfile: infrastructure/docker/backend.Dockerfile }
    env_file: .env
    ports: ["8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 15s
    restart: unless-stopped

  worker:
    build: { context: ., dockerfile: infrastructure/docker/backend.Dockerfile }
    env_file: .env
    command: ["celery", "-A", "vp_worker.celery_app", "worker", "-B", "--loglevel=INFO", "--concurrency=1"]
    volumes: [media:/data/media]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      args: { NEXT_PUBLIC_API_URL: "http://localhost:8000" }
    ports: ["3000:3000"]
    depends_on: [api]
    restart: unless-stopped

volumes: { pgdata: {}, redisdata: {}, media: {} }
